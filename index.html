<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour ma princesse ❤️</title>
    <!-- Liaison avec la feuille de style CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================================================= -->
    <!-- SECTION AUDIO DE FOND & CONTRÔLE FLOTTANT          -->
    <!-- ================================================= -->
    <audio id="musique-fond" preload="auto" loop>
        <source src="she goes by. _ official music video(MP3_160K).mp3" type="audio/mp3">
        Votre navigateur ne supporte pas l'audio.
    </audio>

    <button id="btnAudioControle" class="btn-audio-controle">🔊 Couper le son</button>

    <!-- ================================================= -->
    <!-- CONTENEUR GLOBAL DE L'APPLICATION                  -->
    <!-- ================================================= -->
    <main class="main-container">

        <!-- PAGE 1 : ACCUEIL (Photo de profil + Bouton d'entrée) -->
        <section id="page-accueil" class="page active">
            <img src="B.jpeg" alt="Photo de la princesse" class="profile-pic">
            <div class="boutons-groupe" style="margin-top: 0;">
                <button id="btnVersPage2" class="btn-action">Clique ici ma princesse ❤️</button>
            </div>
        </section>

        <!-- PAGE 2 : TRANSITION (Message de soutien progressif) -->
        <section id="page-transition" class="page">
            <h2 class="titre-message">Je sais que ça ne va pas...</h2>
            <p id="texte-machine-1" class="texte-soutien"></p>
            <div class="boutons-groupe">
                <button id="btnVersPage3" class="btn-action">Clique ici ✨</button>
                <button id="btnRetour1" class="btn-secondary">Retour</button>
            </div>
        </section>

        <!-- PAGE 3 : GALERIE / CARROUSEL DE SOUVENIRS -->
        <section id="page-galerie" class="page">
            <h2 class="titre-message">Quelques instants précieux...</h2>
            <p class="texte-soutien" style="font-size: 0.95rem; margin-bottom: 15px;">Utilise les flèches pour faire défiler nos souvenirs. Clique sur l'écran pour l'agrandir.</p>
            
            <!-- Structure horizontale : Flèche gauche - Cadre Vidéo - Flèche droite -->
            <div class="galerie-layout-horizontal">
                <button id="btnCarrouselPrecedent" class="carrousel-fleche">❮</button>
                
                <!-- Wrapper cliquable pour déclencher le pop-up de la vidéo active -->
                <div class="carrousel-item-wrapper" id="declencheurPopup">
                    <video id="videoCarrouselActive" class="content-video-principal" muted loop playsinline>
                        <source src="1.mp4" type="video/mp4">
                    </video>
                </div>

                <button id="btnCarrouselSuivant" class="carrousel-fleche">❯</button>
            </div>

            <!-- Conteneur pour le texte affiché sous le carrousel -->
            <div class="texte-lateral-conteneur">
                <p id="texte-carrousel-actif" class="texte-machine-lateral"></p>
            </div>
            
            <div class="boutons-groupe" style="margin-top: 20px;">
                <button id="btnVersPage4" class="btn-action">Message final 💌</button>
                <button id="btnRetour2" class="btn-secondary">Retour</button>
            </div>
        </section>

        <!-- PAGE 4 : MESSAGE FINAL ROMANTIQUE -->
        <section id="page-message-final" class="page">
            <h2 class="titre-message">Un dernier mot pour toi</h2>
            <div id="conteneur-message-personnalise" style="text-align: left; padding: 0 10px; margin-bottom: 20px;">
                <p id="texte-machine-2" class="texte-soutien" style="font-size: 0.95rem; line-height: 1.5; white-space: pre-line;"></p>
            </div>
            <div class="boutons-groupe">
                <button id="btnRetourAccueil" class="btn-secondary">Retour</button>
            </div>
        </section>

    </main>

    <!-- ================================================= -->
    <!-- MODALE (POP-UP) : Intégrée sans cadre et texte à côté -->
    <!-- ================================================= -->
    <div id="popup-video-global" class="modal-overlay" style="display: none;">
        <div class="modal-conteneur">
            <!-- Bouton de fermeture de la modale positionné en haut -->
            <button class="modal-fermer" id="fermerPopupModal">&times;</button>
            
            <!-- Vidéo intégrée sans encadré gris -->
            <video id="videoPopupModal" class="content-video-modal" controls playsinline>
                <source id="sourceVideoModal" src="1.mp4" type="video/mp4">
            </video>
            
            <!-- Zone contenant le texte pour la saisie automatique à côté de la vidéo -->
            <div class="modal-texte-zone">
                <p id="texte-modal-actif" class="modal-message"></p>
            </div>
        </div>
    </div>

    <!-- Liaison avec le script JavaScript externe -->
    <script src="script.js"></script>
</body>
</html>
